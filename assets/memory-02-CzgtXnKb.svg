    <rect x="610" y="68" width="352" height="238" rx="8" fill="url(#cover)"/>
    <rect x="626" y="84" width="320" height="206" rx="4" fill="url(#paper)"/>
    <path d="M786 84v206" stroke="#d8c0af" stroke-width="2"/>
    <g stroke="#b99486" stroke-linecap="round" opacity=".55">
      <path d="M654 124h104M654 142h92M654 160h110M654 178h76" stroke-width="2"/>
      <path d="M814 124h104M814 142h83M814 160h106M814 178h64" stroke-width="2"/>
      <path d="M654 218h102M654 236h76M814 218h95M814 236h108" stroke-width="2"/>
    </g>
    <path d="M790 70c-9 8-15 8-23 4 4 8 3 14-2 22 9-4 15-2 22 5 0-11 2-17 9-23-2-4-4-6-6-8Z" fill="#f5d9df" opacity=".9" transform="rotate(18 790 88)"/>
  </g>

  <g transform="rotate(-16 150 250)">
    <ellipse cx="155" cy="278" rx="92" ry="24" fill="#8b6658" opacity=".18" filter="url(#soft6)"/>
    <path d="M106 196h96l-10 94c-2 17-16 30-33 30h-10c-17 0-31-13-33-30Z" fill="#f8eee2"/>
    <path d="M106 196h96l-10 94c-2 17-16 30-33 30h-10c-17 0-31-13-33-30Z" fill="none" stroke="#d9beaa" stroke-width="2"/>
    <path d="M154 197c-9-34-4-63 9-91M154 196c13-31 37-49 65-57M154 198c-22-20-45-27-67-29" fill="none" stroke="#9d7561" stroke-width="3"/>
