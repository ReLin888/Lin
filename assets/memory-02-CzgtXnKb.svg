<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-labelledby="title desc">
  <title id="title">两杯咖啡和一本摊开的书</title>
  <desc id="desc">奶油色桌布上有两杯热咖啡、一本摊开的书和一枝干花，阳光斜斜落在桌面。</desc>
  <defs>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ead4c1"/>
      <stop offset=".44" stop-color="#f5e8d9"/>
      <stop offset="1" stop-color="#e5cbb8"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ea" stop-opacity=".85"/>
      <stop offset=".6" stop-color="#fff8ea" stop-opacity=".13"/>
      <stop offset="1" stop-color="#fff8ea" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coffee" cx=".42" cy=".38" r=".65">
      <stop offset="0" stop-color="#b98a68"/>
      <stop offset=".55" stop-color="#7d503a"/>
      <stop offset="1" stop-color="#4d2f23"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f3e5d8"/>
      <stop offset="1" stop-color="#ddc5b3"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#eadaca"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98a93"/>
      <stop offset="1" stop-color="#8d525f"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="soft6" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1000" height="750" fill="url(#table)"/>
  <path d="M0 0H1000V750H0Z" fill="url(#light)" opacity=".75"/>
  <path d="M-80 640L540 40h240L160 750H-80Z" fill="#fffaf0" opacity=".18" filter="url(#soft)"/>
  <g opacity=".18" stroke="#b88f7d" stroke-width="1">
    <path d="M0 130H1000M0 268H1000M0 410H1000M0 560H1000M0 690H1000"/>
  </g>

  <g transform="rotate(-7 330 430)">
    <ellipse cx="330" cy="452" rx="180" ry="82" fill="#7d5447" opacity=".18" filter="url(#soft)"/>
    <circle cx="330" cy="430" r="148" fill="#f9f1e7"/>
    <circle cx="330" cy="430" r="136" fill="none" stroke="#d9b9a8" stroke-width="2" opacity=".8"/>
    <circle cx="330" cy="430" r="108" fill="url(#cup)"/>
    <circle cx="330" cy="430" r="94" fill="#dcc3b0"/>
    <circle cx="330" cy="430" r="88" fill="url(#coffee)"/>
    <path d="M330 388c-20-26-62-4-39 30 12 18 30 31 39 39 9-8 27-21 39-39 23-34-19-56-39-30Z" fill="#fbf1e2" opacity=".92"/>
    <path d="M278 386c16-31 52-49 87-45" fill="none" stroke="#fff8ed" stroke-width="4" stroke-linecap="round" opacity=".35"/>
    <path d="M428 380c30 0 41 17 34 39-7 21-26 32-54 33" fill="none" stroke="#e5cdbb" stroke-width="16" stroke-linecap="round"/>
    <path d="M428 380c30 0 41 17 34 39-7 21-26 32-54 33" fill="none" stroke="#fbf2e7" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g transform="rotate(6 690 465)">
    <ellipse cx="690" cy="490" rx="176" ry="78" fill="#7d5447" opacity=".16" filter="url(#soft)"/>
    <circle cx="690" cy="465" r="143" fill="#f6ebdf"/>
    <circle cx="690" cy="465" r="132" fill="none" stroke="#d8b8a7" stroke-width="2" opacity=".8"/>
    <circle cx="690" cy="465" r="104" fill="url(#cup)"/>
    <circle cx="690" cy="465" r="91" fill="#ddc4b2"/>
    <circle cx="690" cy="465" r="85" fill="url(#coffee)"/>
    <path d="M690 423c-18-24-58-4-36 28 11 17 28 29 36 36 8-7 25-19 36-36 22-32-18-52-36-28Z" fill="#f8ecdc" opacity=".88"/>
    <path d="M638 420c16-30 50-47 84-43" fill="none" stroke="#fff8ed" stroke-width="4" stroke-linecap="round" opacity=".3"/>
    <path d="M783 417c28 0 39 16 32 37-6 20-25 30-51 31" fill="none" stroke="#e5cdbb" stroke-width="15" stroke-linecap="round"/>
    <path d="M783 417c28 0 39 16 32 37-6 20-25 30-51 31" fill="none" stroke="#fbf2e7" stroke-width="8" stroke-linecap="round"/>
  </g>

