      <ellipse cx="159" cy="103" rx="8" ry="15" transform="rotate(-26 159 103)"/>
      <ellipse cx="221" cy="136" rx="9" ry="17" transform="rotate(56 221 136)"/>
      <ellipse cx="216" cy="140" rx="7" ry="14" transform="rotate(14 216 140)"/>
      <ellipse cx="84" cy="165" rx="8" ry="16" transform="rotate(-46 84 165)"/>
      <ellipse cx="88" cy="160" rx="7" ry="13" transform="rotate(4 88 160)"/>
    </g>
  </g>

  <g fill="#d8b9a6">
    <ellipse cx="484" cy="646" rx="7" ry="12" transform="rotate(28 484 646)"/>
    <ellipse cx="536" cy="614" rx="5" ry="9" transform="rotate(-20 536 614)" opacity=".7"/>
    <ellipse cx="908" cy="578" rx="5" ry="10" transform="rotate(48 908 578)" opacity=".6"/>
  </g>
</svg>
