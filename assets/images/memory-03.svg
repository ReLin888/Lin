<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">海边落日</title>
  <desc id="desc">粉橘色的太阳落在安静的海面上，海水把余晖拉成一条长长的金光。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f7f9d"/>
      <stop offset=".35" stop-color="#d9a2aa"/>
      <stop offset=".67" stop-color="#f4c4ae"/>
      <stop offset="1" stop-color="#f9e2c8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c48d91"/>
      <stop offset=".35" stop-color="#8d6574"/>
      <stop offset="1" stop-color="#463d52"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6df" stop-opacity="1"/>
      <stop offset=".35" stop-color="#ffe4c5" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffcfb7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9c7" stop-opacity=".95"/>
      <stop offset="1" stop-color="#e9b394" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="tinyblur">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#sky)"/>
