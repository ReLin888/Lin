<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">月夜窗边</title>
  <desc id="desc">深玫瑰色的夜里，一弯月亮停在窗外，窗台上亮着蜡烛，一只小猫蜷着睡着了。</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#513e4d"/>
      <stop offset=".55" stop-color="#6b4e5d"/>
      <stop offset="1" stop-color="#3e2f3e"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f2a45"/>
      <stop offset=".48" stop-color="#5c4a69"/>
      <stop offset=".8" stop-color="#9a7080"/>
      <stop offset="1" stop-color="#d4a39e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d9" stop-opacity=".78"/>
      <stop offset=".45" stop-color="#ffeccd" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffeccd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0cfc5"/>
      <stop offset=".35" stop-color="#e5b7b3"/>
      <stop offset=".62" stop-color="#f5dcd0"/>
      <stop offset="1" stop-color="#d5a4a5"/>
    </linearGradient>
    <linearGradient id="sill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0c5b8"/>
      <stop offset="1" stop-color="#ae8a82"/>
    </linearGradient>
    <radialGradient id="candleGlow" cx=".5" cy=".62" r=".5">
      <stop offset="0" stop-color="#ffe1a5" stop-opacity=".9"/>
      <stop offset=".4" stop-color="#ffbd7d" stop-opacity=".32"/>
      <stop offset="1" stop-color="#ffb673" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="blur6">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="star">
      <path d="M0-7 1.8-1.8 7 0 1.8 1.8 0 7-1.8 1.8-7 0-1.8-1.8Z" fill="#ffeccc"/>
    </g>
  </defs>

  <rect width="900" height="1200" fill="url(#room)"/>
  <ellipse cx="450" cy="910" rx="410" ry="250" fill="#2d2130" opacity=".45" filter="url(#blur)"/>

  <path d="M156 954V332c0-157 129-272 294-272s294 115 294 272v622Z" fill="#2b2438" opacity=".5"/>
