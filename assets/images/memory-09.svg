<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-labelledby="title desc">
  <title id="title">星空下并排的两把椅子</title>
  <desc id="desc">深蓝色的海面映着晚霞，两把椅子并排放在沙丘上，中间的灯发出暖光，头顶满天星。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252940"/>
      <stop offset=".32" stop-color="#4b425f"/>
      <stop offset=".62" stop-color="#8c6474"/>
      <stop offset=".82" stop-color="#d99a8c"/>
      <stop offset="1" stop-color="#f3c1a2"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d5a70"/>
      <stop offset=".4" stop-color="#4e4a63"/>
      <stop offset="1" stop-color="#35344b"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4652"/>
      <stop offset="1" stop-color="#372c3b"/>
    </linearGradient>
    <radialGradient id="lantern" cx=".5" cy=".6" r=".5">
      <stop offset="0" stop-color="#ffe3ac" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ffd095" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffbd83" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f1b7a0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f1b7a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <g id="star">
      <path d="M0-6 1.5-1.5 6 0 1.5 1.5 0 6-1.5 1.5-6 0-1.5-1.5Z" fill="#ffeccd"/>
    </g>
  </defs>

