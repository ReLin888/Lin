    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2528"/>
      <stop offset=".6" stop-color="#56424a"/>
      <stop offset="1" stop-color="#c6a06f"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
