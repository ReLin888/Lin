      <stop offset=".48" stop-color="#704c44"/>
      <stop offset="1" stop-color="#3e2c2b"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".42" r=".52">
      <stop offset="0" stop-color="#ffdfae" stop-opacity=".55"/>
      <stop offset=".52" stop-color="#f4bd88" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f4bd88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".7" stop-color="#f5e6d3"/>
      <stop offset="1" stop-color="#e2cbb4"/>
    </linearGradient>
    <linearGradient id="envelope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eed8c1"/>
      <stop offset="1" stop-color="#cda888"/>
