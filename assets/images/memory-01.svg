<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-labelledby="title desc">
  <title id="title">樱花枝与春日天空</title>
  <desc id="desc">奶油色天空中伸出一枝淡粉樱花，花瓣在风里轻轻飘落。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f5dadd"/>
      <stop offset=".48" stop-color="#f9e9e5"/>
      <stop offset="1" stop-color="#fdf7ee"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff8e7" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ffe9dc" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffe9dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fde8ec"/>
      <stop offset=".55" stop-color="#f5bccb"/>
      <stop offset="1" stop-color="#e79bb1"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a3a3f"/>
      <stop offset="1" stop-color="#8a5a5e"/>
    </linearGradient>
    <filter id="blur20" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <g id="blossom">
      <ellipse cx="0" cy="-13" rx="9" ry="14.5" fill="url(#petal)"/>
      <ellipse cx="0" cy="-13" rx="9" ry="14.5" fill="url(#petal)" transform="rotate(72)"/>
      <ellipse cx="0" cy="-13" rx="9" ry="14.5" fill="url(#petal)" transform="rotate(144)"/>
      <ellipse cx="0" cy="-13" rx="9" ry="14.5" fill="url(#petal)" transform="rotate(216)"/>
      <ellipse cx="0" cy="-13" rx="9" ry="14.5" fill="url(#petal)" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="3.6" fill="#c7778c"/>
      <circle cx="-1" cy="-1" r="1.2" fill="#fff5ef" opacity=".7"/>
    </g>
    <g id="bud">
      <ellipse cx="0" cy="0" rx="7" ry="11" fill="#eeacbd"/>
      <path d="M0 8C-2 14-6 17-9 18" fill="none" stroke="#7b5250" stroke-width="2"/>
    </g>
  </defs>

  <rect width="900" height="1125" fill="url(#sky)"/>
  <circle cx="702" cy="214" r="310" fill="url(#sun)"/>
  <circle cx="716" cy="210" r="74" fill="#fff4e4" opacity=".55" filter="url(#blur20)"/>

  <g opacity=".22" fill="#e9aabb">
    <circle cx="120" cy="200" r="5"/><circle cx="210" cy="124" r="3"/><circle cx="770" cy="390" r="4"/>
    <circle cx="620" cy="110" r="2.5"/><circle cx="815" cy="620" r="3"/><circle cx="90" cy="410" r="2"/>
  </g>

  <g fill="none" stroke="url(#branch)" stroke-linecap="round">
    <path d="M-40 1040C130 930 165 798 264 700 350 615 438 586 560 534" stroke-width="18"/>
    <path d="M238 721C335 695 382 644 418 560" stroke-width="9"/>
    <path d="M395 608C484 626 548 594 606 552" stroke-width="7"/>
    <path d="M512 550C574 512 586 455 604 398" stroke-width="5"/>
    <path d="M280 681C246 610 237 555 252 486" stroke-width="4"/>
    <path d="M607 544C686 526 742 539 808 576" stroke-width="5"/>
    <path d="M671 533C716 490 741 444 748 394" stroke-width="3"/>
    <path d="M428 557C432 491 410 436 386 390" stroke-width="3"/>
    <path d="M332 665C367 609 385 566 392 512" stroke-width="3"/>
  </g>

  <g>
    <use href="#blossom" transform="translate(262 484) scale(1.5) rotate(12)"/>
    <use href="#blossom" transform="translate(335 553) scale(1.05) rotate(-28)"/>
    <use href="#blossom" transform="translate(420 560) scale(1.7) rotate(40)"/>
    <use href="#blossom" transform="translate(495 566) scale(.9) rotate(80)"/>
    <use href="#blossom" transform="translate(604 398) scale(1.35) rotate(-14)"/>
    <use href="#blossom" transform="translate(642 534) scale(1.6) rotate(20)"/>
    <use href="#blossom" transform="translate(738 552) scale(.95) rotate(62)"/>
    <use href="#blossom" transform="translate(798 578) scale(1.25) rotate(-40)"/>
    <use href="#blossom" transform="translate(548 534) scale(.7) rotate(14)"/>
    <use href="#blossom" transform="translate(290 659) scale(.8) rotate(-60)"/>
    <use href="#blossom" transform="translate(447 503) scale(.65) rotate(110)"/>
    <use href="#blossom" transform="translate(700 436) scale(.65) rotate(45)"/>
    <use href="#blossom" transform="translate(235 735) scale(1.1) rotate(30)"/>
    <use href="#blossom" transform="translate(388 390) scale(.85) rotate(-10)"/>
    <use href="#blossom" transform="translate(140 880) scale(1.15) rotate(75)" opacity=".9"/>
    <use href="#bud" transform="translate(474 609) scale(1.15) rotate(-30)"/>
    <use href="#bud" transform="translate(680 475) scale(.9) rotate(30)"/>
    <use href="#bud" transform="translate(756 384) scale(.8) rotate(-10)"/>
    <use href="#bud" transform="translate(370 594) scale(.75) rotate(80)"/>
  </g>

  <g fill="url(#petal)">
    <ellipse cx="580" cy="720" rx="8" ry="14" transform="rotate(28 580 720)" opacity=".8"/>
    <ellipse cx="660" cy="815" rx="7" ry="12" transform="rotate(-22 660 815)" opacity=".65"/>
    <ellipse cx="468" cy="812" rx="6" ry="10" transform="rotate(64 468 812)" opacity=".6"/>
    <ellipse cx="765" cy="700" rx="5" ry="9" transform="rotate(15 765 700)" opacity=".5"/>
    <ellipse cx="338" cy="890" rx="7" ry="11" transform="rotate(-48 338 890)" opacity=".45"/>
    <ellipse cx="548" cy="944" rx="5" ry="8" transform="rotate(10 548 944)" opacity=".4"/>
  </g>

  <rect width="900" height="1125" fill="none" stroke="#f8e9e3" stroke-width="26" opacity=".28"/>
</svg>
