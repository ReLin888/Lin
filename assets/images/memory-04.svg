<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-labelledby="title desc">
  <title id="title">窗边的郁金香</title>
  <desc id="desc">暖粉色陶瓶里插着一束奶油色和粉色郁金香，午后的光从拱窗照进来。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d8cc"/>
      <stop offset=".5" stop-color="#f7e8dc"/>
      <stop offset="1" stop-color="#ecd0c2"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5e4"/>
      <stop offset=".55" stop-color="#f8dfca"/>
      <stop offset="1" stop-color="#e6bda9"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7ae98"/>
      <stop offset="1" stop-color="#bc8e7d"/>
    </linearGradient>
    <linearGradient id="vase" x1="0" y1="0" x2="1" y2=".8">
      <stop offset="0" stop-color="#efc3c5"/>
      <stop offset=".5" stop-color="#dfa5aa"/>
      <stop offset="1" stop-color="#b97680"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7e9" stop-opacity=".78"/>
      <stop offset=".75" stop-color="#fff7e9" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff7e9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7b49d"/>
      <stop offset="1" stop-color="#6e7d67"/>
    </linearGradient>
    <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="tulip">
      <path d="M0 0c-27-4-40-30-32-63 5-21 16-38 32-50 16 12 27 29 32 50 8 33-5 59-32 63Z" fill="currentColor"/>
      <path d="M-14-102c1 28 4 57 14 91 10-34 13-63 14-91-5 15-9 23-14 28-5-5-9-13-14-28Z" fill="#fff" opacity=".16"/>
      <path d="M-2 0c-16-7-24-22-18-42" fill="none" stroke="#fff" stroke-width="2" opacity=".16"/>
    </g>
  </defs>

