    <path d="M103 300c-28 0-44 18-45 38h90c-1-20-17-38-45-38Z" fill="#2e2938"/>
    <circle cx="103" cy="332" r="26" fill="#ffe2ac" opacity=".85" filter="url(#soft)"/>
