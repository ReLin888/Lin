    <rect x="942" y="498" width="11" height="15" rx="1"/><rect x="968" y="498" width="11" height="15" rx="1"/>
    <rect x="668" y="512" width="10" height="14" rx="1"/><rect x="688" y="512" width="10" height="14" rx="1"/>
