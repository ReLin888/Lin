<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-labelledby="title desc">
  <title id="title">雨夜的城市灯火</title>
  <desc id="desc">雨后的城市泛着暖色的光，一对身影并肩站在街灯下，远处的灯火化成柔软的圆斑。</desc>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a405e"/>
      <stop offset=".44" stop-color="#846271"/>
      <stop offset=".75" stop-color="#c78e89"/>
      <stop offset="1" stop-color="#e7b9a0"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#413947"/>
      <stop offset=".5" stop-color="#2e2a39"/>
      <stop offset="1" stop-color="#211f2c"/>
    </linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6b3" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffd29d" stop-opacity=".05"/>
    </linearGradient>
    <filter id="bokeh" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1000" height="750" fill="url(#dusk)"/>
  <ellipse cx="170" cy="260" rx="220" ry="180" fill="#b17d8b" opacity=".25" filter="url(#glow)"/>
  <ellipse cx="790" cy="340" rx="240" ry="160" fill="#e2a286" opacity=".18" filter="url(#glow)"/>

  <g fill="#ffd9a0" filter="url(#bokeh)">
    <circle cx="170" cy="180" r="46" opacity=".6"/>
    <circle cx="235" cy="126" r="18" opacity=".5"/>
    <circle cx="320" cy="228" r="30" opacity=".3"/>
    <circle cx="733" cy="192" r="52" opacity=".4"/>
    <circle cx="823" cy="120" r="23" opacity=".5"/>
    <circle cx="900" cy="286" r="38" opacity=".28"/>
    <circle cx="625" cy="305" r="22" opacity=".36"/>
    <circle cx="484" cy="176" r="15" opacity=".26"/>
    <circle cx="89" cy="392" r="34" opacity=".25"/>
  </g>
  <g fill="#f5c3ad" filter="url(#bokeh)" opacity=".3">
